name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Whisper native runtime
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ggml-org/whisper.cpp.git vendor/whisper.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c")
          source = p.read_text()
          import re
          updated, count = re.subn(r'params\.language\s*=\s*"[^"]+"\s*;', 'params.language = "ar";', source)
          if count != 1:
              raise SystemExit(f"Expected exactly one Whisper language setting; found {count}")
          p.write_text(updated)
          print("Whisper transcription language verified: ar")
          PY
      - name: Install Android NDK
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Verify source files
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nameregister/app/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee android-build.log
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Name-Register-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
