name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Whisper native runtime
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ggml-org/whisper.cpp.git vendor/whisper.cpp
          sed -i 's/params.language = "en";/params.language = "ar";/' vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c
          grep -q 'params.language = "ar";' vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c
      - name: Run standalone JVM regression tests
        run: |
          mkdir -p /tmp/name-registry-tests
          javac -encoding UTF-8 -d /tmp/name-registry-tests \
            app/src/main/java/com/nameregister/app/SpeechEndDetector.java \
            app/src/test/java/com/nameregister/app/SpeechEndDetectorTest.java \
            app/src/main/java/com/nameregister/app/LocalCommandBrain.java \
            app/src/test/java/com/nameregister/app/LocalCommandBrainTest.java
          java -cp /tmp/name-registry-tests com.nameregister.app.SpeechEndDetectorTest
          java -cp /tmp/name-registry-tests com.nameregister.app.LocalCommandBrainTest
      - name: Install Android NDK
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Verify source files
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nameregister/app/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee android-build.log
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Name-Register-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
