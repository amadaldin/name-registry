name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build sherpa-onnx Android runtime for app
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.13.8 https://github.com/k2-fsa/sherpa-onnx.git /tmp/sherpa-onnx
          curl --fail --location --retry 3 -o /tmp/sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p /tmp/sherpa-native
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa-native
          LIB_DIR=$(find /tmp/sherpa-native -type d -path '*/jniLibs/arm64-v8a' -print -quit)
          test -n "$LIB_DIR"
          TARGET=/tmp/sherpa-onnx/android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs/arm64-v8a
          mkdir -p "$TARGET" app/libs
          cp -a "$LIB_DIR"/. "$TARGET"/
          cd /tmp/sherpa-onnx/android/SherpaOnnxAar
          bash ./gradlew :sherpa_onnx:assembleRelease --no-daemon
          cp sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar"
      - name: Checkout Whisper native runtime
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ggml-org/whisper.cpp.git vendor/whisper.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c")
          source = p.read_text()
          import re
          updated, count = re.subn(r'params\.language\s*=\s*"[^"]+"\s*;', 'params.language = "ar";', source)
          if count != 1:
              raise SystemExit(f"Expected exactly one Whisper language setting; found {count}")
          p.write_text(updated)
          print("Whisper transcription language verified: ar")
          PY
      - name: Install Android NDK
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Verify source files
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nameregister/app/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Arabic voice command parsing
        run: |
          mkdir -p /tmp/name-registry-test
          javac -encoding UTF-8 -d /tmp/name-registry-test app/src/main/java/com/nameregister/app/LocalCommandBrain.java tests/LocalCommandBrainTest.java
          java -cp /tmp/name-registry-test LocalCommandBrainTest
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee android-build.log
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Name-Register-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
