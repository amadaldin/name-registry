name: Build sherpa-onnx Android runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sherpa-android-aar.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get pinned sherpa-onnx sources
        run: git clone --depth 1 --branch v1.13.8 https://github.com/k2-fsa/sherpa-onnx.git sherpa-onnx
      - name: Download official Android native libraries
        run: |
          curl --fail --location --retry 3 -o sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          tar -xjf sherpa-android.tar.bz2
          LIB_DIR=$(find . -type d -path '*/jniLibs/arm64-v8a' -print -quit)
          test -n "$LIB_DIR"
          mkdir -p sherpa-onnx/android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs/arm64-v8a
          cp -av "$LIB_DIR"/. sherpa-onnx/android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs/arm64-v8a/
      - name: Assemble Android AAR
        working-directory: sherpa-onnx/android/SherpaOnnxAar
        run: bash ./gradlew :sherpa_onnx:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-arm64-runtime
          path: sherpa-onnx/android/SherpaOnnxAar/sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar
          if-no-files-found: error
